name: Release

# Triggered by pushing a `vX.Y.Z` tag to `main`. The tag IS the release
# signal — there is no Actions-tab dispatch, no version input, and no
# CI-side `cargo set-version`. The human-side bump happens in a normal PR
# before the tag is pushed; the workflow only builds, publishes and
# verifies.
#
# Job sequence:
#
#   guard ┬→ test (matrix) ──┬→ publish-crates ─┬→ release
#         ├→ javascript ────┼→ publish-nuget ──┤
#         ├→ embedded ──────┼→ publish-npm ────┘
#         └→ publish-gate ┬─┘
#                         └→ native (matrix) ─┘
#
# 1. guard:          asserts that the workspace `Cargo.toml` at the tagged
#                    commit reads `version = "${tag#v}"`. Catches a tag
#                    pushed against the wrong commit before any expensive
#                    job runs.
# 2. test:           the Rust workspace and the .NET binding, on every
#                    shipped platform. The golden vectors of
#                    docs/spec/interchange.md §3 run through the crate,
#                    the C ABI and the binding.
# 2b. javascript:    the same vectors through the WebAssembly binding, and
#                    every example on its npm front page.
# 2c. embedded:      the core and a generated table built for
#                    thumbv7em-none-eabihf, so the bare-target claim is
#                    proved on the commit being published.
# 3. publish-gate:   parses the head commit's message line by line and
#                    outputs `publish=true|false`. Only a STANDALONE
#                    `[skip publish]` line counts as a skip; a mention of
#                    the token inside a sentence does not. Runs beside the
#                    test matrix so it does not lengthen the path.
# 4. publish-crates: OIDC via rust-lang/crates-io-auth-action, then
#                    `cargo publish` for chdef-core, chdef, chdef-capi,
#                    chdef-gen and chdef-macros in dependency order.
# 5. native:         builds the C ABI on a runner of each shipped
#                    runtime's own OS and architecture.
# 6. publish-nuget:  collects those libraries, packs them into the
#                    package, and pushes over OIDC via NuGet/login.
# 7. publish-npm:    builds both WebAssembly targets and publishes the npm
#                    package over OIDC, which npm reads from the job's own
#                    id-token — no npm token is stored anywhere.
#
# No long-lived secrets. GITHUB_TOKEN is auto-provided; crates.io,
# nuget.org and npmjs.com trust is established via OIDC. All three need
# Trusted Publishing configured once for this repository and this workflow
# filename.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: guard (every version site matches the tag)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Derive version from tag and check every version site
        id: derive
        # The most common footgun under the human-tag flow is "tagged the
        # wrong commit". Catching it here avoids burning the build matrix
        # on a tag that will never publish.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! echo "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag $tag is not in vX.Y.Z form" >&2
            exit 1
          fi
          version="${tag#v}"
          check() {
            found=$(sed -nE "$2" "$1" | head -1)
            if [ "$found" != "$version" ]; then
              echo "::error::tag $tag implies version $version, but $1 reads ${found:-nothing}" >&2
              exit 1
            fi
            echo "  $1 = $found"
          }
          echo "guard: tag=$tag version=$version"
          check Cargo.toml 's/^version = "(.*)"/\1/p'
          check bindings/dotnet/Directory.Build.props 's|.*<Version>(.*)</Version>.*|\1|p'
          check bindings/js/package.json 's/^  "version": "(.*)",/\1/p'
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-gate:
    name: decide whether to publish
    # `contains(..., '[skip publish]')` is a substring match: it fires when
    # the release commit merely *mentions* the token, even inside an
    # explanatory paragraph. This job parses the message line by line and
    # only flags a skip when the literal string is a STANDALONE LINE.
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Inspect head commit message
        id: gate
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # `grep -Fxq` matches the whole line literally; the awk trim
          # collapses surrounding whitespace so `  [skip publish]  ` still
          # counts. A mention inside a sentence never appears as its own
          # line, so it does not match.
          if printf '%s' "$COMMIT_MSG" | awk '{$1=$1;print}' | grep -Fxq '[skip publish]'; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Found '[skip publish]' as a standalone line — publishing will be skipped."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "No standalone '[skip publish]' line — will publish."
          fi

  test:
    # A tag is published only from a commit whose tests pass on every
    # shipped platform.
    name: Test (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Test the workspace
        run: |
          cargo test --workspace --locked
          cargo test --workspace --locked --all-features
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: bindings/dotnet/global.json
      # The golden vectors of docs/spec/interchange.md §3 certify the path
      # the C# project actually takes, not one beside it (ADR-0022).
      - name: Test the .NET binding
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p chdef-capi --release --locked
          target=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import sys,json;print(json.load(sys.stdin)["target_directory"])')
          case "${{ runner.os }}" in
            Windows) native="$target/release/chdef_capi.dll" ;;
            macOS)   native="$target/release/libchdef_capi.dylib" ;;
            *)       native="$target/release/libchdef_capi.so" ;;
          esac
          dotnet restore bindings/dotnet/Chdef.slnx --locked-mode
          CHDEF_NATIVE="$native" dotnet test bindings/dotnet/Chdef.slnx \
            --configuration Release --no-restore

  javascript:
    # The golden vectors of docs/spec/interchange.md §3 certify the path a
    # JavaScript project actually takes, not one beside it (ADR-0030).
    name: Test the JavaScript binding
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0
      - name: Build and test
        working-directory: bindings/js
        run: |
          node build.mjs
          npm test

  embedded:
    # The core claims to run without std, an allocator or a float, and only a
    # build for a bare target proves it; the generated table must compile there.
    name: Build for a bare target
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: thumbv7em-none-eabihf
      - name: Build the core and the generated table for thumbv7em-none-eabihf
        run: bash scripts/embedded-smoke.sh

  publish-npm:
    # npm reads the job's OIDC token, so nothing long-lived is stored.
    # npmjs.com needs a trusted publisher configured once for this
    # repository and this workflow filename.
    name: Publish to npm (OIDC)
    needs: [guard, javascript, publish-gate]
    if: ${{ needs.publish-gate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      - name: Publish
        # A version already on npm is skipped, so re-running a
        # partially-failed release stays green.
        working-directory: bindings/js
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          # Trusted publishing needs an npm that speaks OIDC.
          npm install -g npm@latest
          # `npm view` handles the scoped name's encoding; an absent
          # version answers with nothing.
          if [ -n "$(npm view "@shortarrow/chdef@$VERSION" version 2>/dev/null || true)" ]; then
            echo "@shortarrow/chdef $VERSION already on npm — skipping"
            exit 0
          fi
          node build.mjs
          npm publish --access public

  publish-crates:
    # Opt out with `[skip publish]` on its own line in the head commit's
    # message. The default for a tagged release is "publish everywhere" —
    # cutting a release means shipping it; skipping is the exception that
    # must be spelled out.
    name: Publish to crates.io (OIDC)
    needs: [guard, test, embedded, publish-gate]
    if: ${{ needs.publish-gate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Exchange OIDC token for crates.io token
        id: auth
        # Pinned to v1.0.4: the first release on Node 24, which silences
        # the "Node.js 20 actions are deprecated" warning.
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Publish the crates in dependency order
        # A version already on crates.io is skipped, so re-running a
        # partially-failed job stays green. Each of the five crates depends
        # by version on one published before it — chdef on chdef-core,
        # chdef-capi and chdef-gen on chdef, chdef-macros on chdef-gen
        # — so the order matters and `cargo publish` waits for
        # the index between them.
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          publish() {
            crate="$1"
            status=$(curl -fsS -A "chdef-release (github.com/ShortArrow/chdef)" \
              -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/$crate/$VERSION" || echo "000")
            if [ "$status" = "200" ]; then
              echo "$crate $VERSION already on crates.io — skipping"
            else
              cargo publish -p "$crate"
            fi
          }
          publish chdef-core
          publish chdef
          publish chdef-capi
          publish chdef-gen
          publish chdef-macros

  native:
    # Each runtime is built on a runner of the same OS and architecture.
    # Cross-building a cdylib for another platform needs that platform's
    # linker (mingw for Windows, osxcross for Apple), and a native runner
    # is both simpler and closer to what the shipped library is.
    name: native ${{ matrix.rid }}
    needs: [guard, publish-gate]
    if: ${{ needs.publish-gate.outputs.publish == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            target: x86_64-unknown-linux-gnu
            file: libchdef_capi.so
          - os: windows-latest
            rid: win-x64
            target: x86_64-pc-windows-msvc
            file: chdef_capi.dll
          # The Apple toolchain builds both architectures from one host.
          - os: macos-latest
            rid: osx-arm64
            target: aarch64-apple-darwin
            file: libchdef_capi.dylib
          - os: macos-latest
            rid: osx-x64
            target: x86_64-apple-darwin
            file: libchdef_capi.dylib
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the C ABI
        run: cargo build -p chdef-capi --release --locked --target ${{ matrix.target }}
      - name: Upload ${{ matrix.rid }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.rid }}
          path: target/${{ matrix.target }}/release/${{ matrix.file }}
          if-no-files-found: error

  publish-nuget:
    # The package carries the native library for each runtime, so a
    # consumer writes `dotnet add package` and nothing else (ADR-0022).
    name: Pack & push to NuGet (OIDC)
    needs: [guard, test, publish-gate, native]
    if: ${{ needs.publish-gate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: bindings/dotnet/global.json

      - name: Collect the native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: native

      - name: Arrange them where the .NET runtime looks
        run: |
          set -euo pipefail
          runtimes=bindings/dotnet/Chdef/runtimes
          for dir in native/native-*; do
            rid="${dir#native/native-}"
            mkdir -p "$runtimes/$rid/native"
            cp "$dir"/* "$runtimes/$rid/native/"
          done
          ls -R "$runtimes"

      - name: Restore (locked)
        run: dotnet restore bindings/dotnet/Chdef.slnx --locked-mode

      - name: Pack
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          dotnet pack bindings/dotnet/Chdef/Chdef.csproj             -c Release --no-restore             -p:Version="$VERSION"             -o ./artifacts/nupkg

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key
      # via the trusted publisher policy registered under the ShortArrow
      # account — the same shape as the crates.io job above.
      - name: NuGet login (OIDC)
        id: nuget-login
        # Not pinned to a SHA: the action is published by the NuGet team
        # and its v1 tag is what their trusted-publishing documentation
        # names. Revisit if they publish immutable release SHAs.
        uses: NuGet/login@v1
        with:
          user: ShortArrow

      - name: Push to NuGet
        run: |
          dotnet nuget push './artifacts/nupkg/*.nupkg'             --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"             --source https://api.nuget.org/v3/index.json             --skip-duplicate

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chdef-nupkg
          path: ./artifacts/nupkg

  release:
    name: Create GitHub Release
    needs: [publish-crates, publish-nuget, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes --verify-tag
