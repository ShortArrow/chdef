name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    # A tag is published only from a commit whose tests pass on every shipped platform.
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: |
          cargo test --workspace --locked
          cargo test --workspace --locked --all-features
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # The golden vectors of docs/spec/interchange.md §3 certify the path
      # the C# project actually takes, not one beside it (ADR-0022).
      - name: Test the .NET binding
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p chdef-capi --release --locked
          target=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import sys,json;print(json.load(sys.stdin)["target_directory"])')
          case "${{ runner.os }}" in
            Windows) native="$target/release/chdef_capi.dll" ;;
            macOS)   native="$target/release/libchdef_capi.dylib" ;;
            *)       native="$target/release/libchdef_capi.so" ;;
          esac
          CHDEF_NATIVE="$native" dotnet test bindings/dotnet/Chdef.sln --configuration Release

  publish-crates:
    # Publish to crates.io via OIDC Trusted Publishing (no long-lived token).
    # A version already on crates.io is a no-op, so re-running a tag stays green.
    # `[skip publish]` in the tagged commit message skips publishing.
    name: Publish to crates.io (OIDC)
    needs: test
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Exchange OIDC token for crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish chdef
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          status=$(curl -fsS -A "chdef-release (github.com/ShortArrow/chdef)" -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/chdef/$version" || echo "000")
          if [ "$status" = "200" ]; then
            echo "chdef $version already on crates.io — skipping"
          else
            cargo publish -p chdef --dry-run
            cargo publish -p chdef
            cargo publish -p chdef-capi --dry-run
            cargo publish -p chdef-capi
          fi

  publish-nuget:
    # The package carries the native library for each platform, so a
    # consumer writes `dotnet add package` and nothing else (ADR-0022).
    name: Publish to NuGet
    needs: test
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install the cross targets
        run: |
          rustup target add x86_64-pc-windows-gnu x86_64-unknown-linux-gnu                             x86_64-apple-darwin aarch64-apple-darwin
      - name: Build the native library for every runtime the package carries
        run: |
          set -euo pipefail
          runtimes=bindings/dotnet/Chdef/runtimes
          build() {
            rust_target="$1"; rid="$2"; file="$3"
            cargo build -p chdef-capi --release --locked --target "$rust_target"
            mkdir -p "$runtimes/$rid/native"
            cp "target/$rust_target/release/$file" "$runtimes/$rid/native/"
          }
          build x86_64-unknown-linux-gnu linux-x64 libchdef_capi.so
          build x86_64-pc-windows-gnu    win-x64   chdef_capi.dll
          # The Apple targets need a macOS host; they are added by the
          # macOS leg of the matrix in a follow-up, and their absence is a
          # missing runtime rather than a broken package.
          ls -R "$runtimes"
      - name: Pack and push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dotnet pack bindings/dotnet/Chdef/Chdef.csproj             --configuration Release -p:Version="$version" -o artifacts
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "no NUGET_API_KEY — packed but not pushed"
          else
            dotnet nuget push "artifacts/Chdef.$version.nupkg"               --source https://api.nuget.org/v3/index.json               --api-key "$NUGET_API_KEY" --skip-duplicate
          fi

  release:
    name: Create GitHub Release
    needs: [publish-crates, publish-nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
