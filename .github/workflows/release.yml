name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    # A tag is published only from a commit whose tests pass on every shipped platform.
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: |
          cargo test --workspace --locked
          cargo test --workspace --locked --all-features
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: bindings/dotnet/global.json
      # The golden vectors of docs/spec/interchange.md §3 certify the path
      # the C# project actually takes, not one beside it (ADR-0022).
      - name: Test the .NET binding
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p chdef-capi --release --locked
          target=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import sys,json;print(json.load(sys.stdin)["target_directory"])')
          case "${{ runner.os }}" in
            Windows) native="$target/release/chdef_capi.dll" ;;
            macOS)   native="$target/release/libchdef_capi.dylib" ;;
            *)       native="$target/release/libchdef_capi.so" ;;
          esac
          dotnet restore bindings/dotnet/Chdef.slnx --locked-mode
          CHDEF_NATIVE="$native" dotnet test bindings/dotnet/Chdef.slnx             --configuration Release --no-restore

  publish-crates:
    # Publish to crates.io via OIDC Trusted Publishing (no long-lived token).
    # A version already on crates.io is a no-op, so re-running a tag stays green.
    # `[skip publish]` in the tagged commit message skips publishing.
    name: Publish to crates.io (OIDC)
    needs: test
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Exchange OIDC token for crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish chdef
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          status=$(curl -fsS -A "chdef-release (github.com/ShortArrow/chdef)" -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/chdef/$version" || echo "000")
          if [ "$status" = "200" ]; then
            echo "chdef $version already on crates.io — skipping"
          else
            cargo publish -p chdef --dry-run
            cargo publish -p chdef
            cargo publish -p chdef-capi --dry-run
            cargo publish -p chdef-capi
          fi

  publish-nuget:
    # The package carries the native library for each runtime, so a
    # consumer writes `dotnet add package` and nothing else (ADR-0022).
    name: Pack & push to NuGet (OIDC)
    needs: test
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: bindings/dotnet/global.json

      - name: Build the native library for every runtime the package carries
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-gnu
          runtimes=bindings/dotnet/Chdef/runtimes
          build() {
            cargo build -p chdef-capi --release --locked --target "$1"
            mkdir -p "$runtimes/$2/native"
            cp "target/$1/release/$3" "$runtimes/$2/native/"
          }
          build x86_64-unknown-linux-gnu linux-x64 libchdef_capi.so
          build x86_64-pc-windows-gnu    win-x64   chdef_capi.dll
          ls -R "$runtimes"

      - name: Restore (locked)
        run: dotnet restore bindings/dotnet/Chdef.slnx --locked-mode

      - name: Pack
        run: |
          set -euo pipefail
          # Strip the leading `v` so v0.1.0 -> 0.1.0 for the package
          # version, matching the crate and the GitHub Release.
          version="${GITHUB_REF_NAME#v}"
          dotnet pack bindings/dotnet/Chdef/Chdef.csproj             -c Release --no-restore             -p:Version="$version"             -o ./artifacts/nupkg

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key
      # via the trusted publisher policy registered under the ShortArrow
      # nuget.org account — the same shape as the crates.io job above, and
      # no long-lived secret in this repository. Requires
      # `permissions.id-token: write` and a matching policy at
      # https://www.nuget.org/account/trusted-publishing.
      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ShortArrow

      - name: Push to NuGet
        run: |
          dotnet nuget push './artifacts/nupkg/*.nupkg'             --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"             --source https://api.nuget.org/v3/index.json             --skip-duplicate

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: chdef-nupkg
          path: ./artifacts/nupkg

  release:
    name: Create GitHub Release
    needs: [publish-crates, publish-nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
