[workspace]
members = ["crates/chdef", "crates/chdef-capi"]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ShortArrow/chdef"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
csv = "1.3"
thiserror = "2"
