[workspace]
members = [
    "crates/chdef-core",
    "crates/chdef",
    "crates/chdef-capi",
    "crates/chdef-wasm",
    "crates/chdef-gen",
]
resolver = "2"

[workspace.package]
version = "0.0.16"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ShortArrow/chdef"

[workspace.dependencies]
# The ABI crate is released beside the crate it wraps, so it depends on
# exactly that version. `cargo publish` refuses a bare path dependency.
chdef = { path = "crates/chdef", version = "0.0.16" }
# The core is released beside the crate that delegates to it, so it depends
# on exactly that version. `cargo publish` refuses a bare path dependency.
chdef-core = { path = "crates/chdef-core", version = "0.0.16" }
serde = { version = "1", features = ["derive"] }
csv = "1.3"
thiserror = "2"
