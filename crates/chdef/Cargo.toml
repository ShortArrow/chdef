[package]
name = "chdef"
description = "Channel and bit-field definitions for binary frames: read the CSVs, compute the frame layout, convert between raw bytes and physical values"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["csv", "telemetry", "bitfield", "channel", "codec"]
categories = ["parsing", "encoding"]

[dependencies]
serde = { workspace = true, optional = true }
csv = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = "1"

[features]
serde = ["dep:serde"]
